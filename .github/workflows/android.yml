name: Fabriquer l'APK Android

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Préparer le projet
        run: |
          if [ ! -f package.json ] && [ -f alltool-pwa.zip ]; then
            unzip -q alltool-pwa.zip -d _projet
            cp -r _projet/* . && cp -r _projet/.github . 2>/dev/null || true
          fi
          ls
      - run: npm install --no-audit --no-fund
      - name: Construire le site
        run: npm run build
      - name: Fabriquer l'APK
        run: bash scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AllTool-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
