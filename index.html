<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Établi</title>
<style>
:root{--paper:#f3eee6;--ink:#1b1916;--card:#fffcf7;--line:#e3dacd;--mute:#6f675e;--copper:#c0562a;--on-copper:#fff8f3;--pine:#234237;--on-ink:#f6f1ea}
@media (prefers-color-scheme:dark){:root{--paper:#161412;--ink:#f1ebe2;--card:#211e1b;--line:#38332d;--mute:#a89f93;--copper:#e0794a;--on-copper:#1b1916;--pine:#8fc4ac;--on-ink:#161412}}
*{box-sizing:border-box}
body{margin:0;padding-bottom:64px;background:var(--paper);color:var(--ink);font:15px/1.5 "Outfit",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,.brand{font-family:"Fraunces",Georgia,serif;font-weight:600}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{font-size:22px;line-height:1}.sub{font-size:12px;color:var(--mute)}
.ctrl{display:flex;align-items:center;gap:8px}
.langsel{min-height:36px;width:auto;padding:0 8px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);font:inherit;font-size:13px}
.planpill{min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--pine);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.planpill.prem{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.shell{display:flex;flex-direction:column}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line)}
nav button{flex:none;display:flex;flex-direction:column;align-items:flex-start;min-height:44px;padding:6px 12px;border:0;border-radius:12px;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
nav button small{display:none;font-size:12px;color:var(--mute)}
nav button[aria-current=page]{background:var(--ink);color:var(--on-ink)}
nav button[aria-current=page] small{color:var(--on-ink);opacity:.8}
nav button:hover:not([aria-current=page]){background:var(--card)}
main{padding:20px 16px 40px;min-width:0;flex:1}
@media(min-width:900px){.shell{flex-direction:row;align-items:flex-start}nav{flex-direction:column;width:250px;flex:none;position:sticky;top:57px;border-bottom:0;border-right:1px solid var(--line);padding:14px 12px;overflow:visible}nav button small{display:block}main{padding:28px 32px 40px}}
section.sheet{max-width:760px}
.titlerow{display:flex;align-items:center;gap:10px}
h1{font-size:30px;line-height:1.15;margin:0}
.info{flex:none;width:28px;height:28px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--mute);font:italic 600 14px Georgia,serif;cursor:pointer}
.lede{margin:10px 0 0;max-width:600px;font-size:14px;color:var(--mute)}
.body{margin-top:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border:0;border-radius:99px;background:var(--copper);color:var(--on-copper);font:inherit;font-weight:500;cursor:pointer;width:100%}
@media(min-width:600px){.btn{width:auto}}
.btn:disabled{opacity:.5;cursor:default}
.ghost{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border:1px solid var(--ink);border-radius:99px;background:none;color:var(--ink);font:inherit;cursor:pointer}
.pill{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;flex:none}
.pill.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-top:10px}
input[type=text],input[type=url],select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
textarea{min-height:160px;resize:vertical}
label.f{display:block;margin-top:16px}label.f>span{display:block;margin-bottom:6px;font-weight:500;font-size:14px}
.drop{margin-top:14px;padding:22px 16px;border:1px dashed var(--line);border-radius:16px;background:var(--card);text-align:center}
.drop.over{border-color:var(--copper)}
.drop p{margin:0 0 10px}
.note{margin:12px 0 0;font-size:14px;color:var(--mute)}.note.ok{color:var(--pine)}.note.err{color:var(--copper)}
.card{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.card img,.card video,.card iframe{display:block;width:100%;max-height:300px;object-fit:contain;background:var(--paper);border-radius:10px}
.card audio{width:100%}
ul.list{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.list li{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
ul.list li span.n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul.list img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.ic{width:44px;height:44px;border:0;border-radius:99px;background:none;color:var(--ink);font:inherit;font-size:16px;cursor:pointer}
.ic:disabled{opacity:.3}
.grid{display:grid;gap:12px;grid-template-columns:1fr;margin-top:18px}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr}}
.grid .card{margin:0;padding:0;overflow:hidden}.grid .meta{display:flex;align-items:center;gap:6px;padding:10px}
.meta .t{flex:1;min-width:0}.meta .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta .t small{color:var(--mute)}
.chosen{display:flex;align-items:center;gap:10px;margin-top:12px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.chosen span{flex:1;min-width:0;padding:11px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chosen button{min-height:44px;border:0;background:none;color:var(--mute);font:inherit;cursor:pointer}
iframe.web{width:100%;height:70vh;margin-top:14px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.warn{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:14px}
.empty{margin:48px 0;text-align:center;color:var(--mute)}.empty b{display:block;font-size:34px;font-weight:400}
.plans{display:grid;gap:10px;margin-top:16px}
@media(min-width:600px){.plans{grid-template-columns:1fr 1fr}}
.plan{padding:14px;border:2px solid var(--line);border-radius:16px;background:var(--card);text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.plan.on{border-color:var(--copper)}.plan b{display:block;font-size:20px}.plan small{color:var(--mute)}
ul.feat{margin:16px 0 0;padding-left:20px}
#ad{position:fixed;left:0;right:0;bottom:0;z-index:4;height:52px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border-top:1px solid var(--line);color:var(--mute);font-size:12px}
#ad[hidden]{display:none}
#ad button{border:0;background:none;color:var(--copper);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;min-height:44px}
.veil{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.55)}
.modal{width:100%;max-width:420px;padding:20px;border-radius:20px;background:var(--paper);border:1px solid var(--line)}
.modal h2{margin:0 0 6px;font-family:"Fraunces",Georgia,serif;font-size:22px}
.modal .btn,.modal .ghost{width:100%;margin-top:10px}
.adbox{display:grid;place-items:center;height:180px;margin-top:12px;border:1px dashed var(--line);border-radius:14px;background:var(--card);color:var(--mute);text-align:center}
</style>
</head>
<body>
<header id="head"></header>
<div class="shell">
  <nav id="nav"></nav>
  <main id="main"><p id="boot" style="color:var(--mute)">…</p><noscript><p>JavaScript is disabled.</p></noscript></main>
</div>
<div id="ad"></div>

<script>
window.addEventListener("error", function (e) {
  var p = document.createElement("pre");
  p.style.cssText = "white-space:pre-wrap;color:#c0562a;font:13px monospace;margin:16px";
  p.textContent = "Error: " + (e.message || "unknown") + (e.filename ? "\n" + e.filename.split("/").pop() + ":" + e.lineno : "");
  (document.getElementById("main") || document.body).appendChild(p);
});
window.addEventListener("unhandledrejection", function (e) {
  var p = document.createElement("pre");
  p.style.cssText = "white-space:pre-wrap;color:#c0562a;font:13px monospace;margin:16px";
  p.textContent = "Error: " + ((e.reason && e.reason.message) || e.reason || "unknown");
  (document.getElementById("main") || document.body).appendChild(p);
});
</script>

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return e;
}

const msg = (e) => (e && e.message) || t("Ça n’a pas marché. Réessaie.");

const KIND = { image: "Image", video: "Vidéo", audio: "Audio", pdf: "PDF", text: "Texte" };
function kindFrom(name, type) {
  const l = name.toLowerCase();

  if (type.startsWith("video/") || /\.(mp4|webm|mov|mkv|m4v)$/.test(l)) return "video";
  if (type.startsWith("audio/") || /\.(mp3|wav|m4a|ogg|aac)$/.test(l)) return "audio";

  const m = /\.([a-z0-9]{1,5})$/i.exec(name);
  if (m) return m[1].toLowerCase();

  if (type.includes("quicktime")) return "mov";
  if (type.includes("wav")) return "wav";
  if (type.includes("mpeg")) return "mp3";
  if (type.includes("mp4")) return "mp4";
  if (type.includes("ogg")) return "ogg";

}

/* Rien de réel ici : compteur local, « publicité » factice, Premium sans paiement.
   À brancher plus tard sur un vrai service (publicités, paiement, comptes). */
const FREE_DAILY = 5, AD_BONUS = 2, AD_SECONDS = 5;
const todayKey = () => new Date().toISOString().slice(0, 10);
function readPlan() {
  const s = { day: todayKey(), used: 0, bonus: 0, premium: false };
  try {
    const r = JSON.parse(store.get("etabli-plan") || "null");
    if (r && typeof r === "object") {
      s.premium = r.premium === true;
      if (r.day === s.day) { s.used = Number(r.used) || 0; s.bonus = Number(r.bonus) || 0; }
    }
  } catch {}
  return s;
}
const writePlan = (s) => store.set("etabli-plan", JSON.stringify(s));
function remaining() { const s = readPlan(); return s.premium ? Infinity : Math.max(0, FREE_DAILY + s.bonus - s.used); }
function spend() { const s = readPlan(); if (!s.premium) { s.used += 1; writePlan(s); } refreshPlan(); }
function refreshPlan() {
  const s = readPlan(), pill = document.getElementById("planpill"), ad = document.getElementById("ad");
  if (pill) {
    pill.className = "planpill" + (s.premium ? " prem" : "");
    pill.textContent = s.premium ? t("Premium") : t("Gratuit · {n} restant(s)", { n: remaining() });
  }
  if (ad) {
    ad.replaceChildren();
    ad.hidden = s.premium; document.body.style.paddingBottom = s.premium ? "0" : "64px";

      let left = AD_SECONDS;

      const go = h("button", { class: "btn", disabled: true, onclick: () => { const s = readPlan(); s.bonus += AD_BONUS; writePlan(s); refreshPlan(); close(true); } }, t("Continuer"));
      veil.replaceChildren(h("div", { class: "modal", role: "dialog", "aria-modal": "true" }, h("div", { class: "adbox" }, t("Espace publicitaire")), label, go));
      const timer = setInterval(() => {
        left -= 1;
        if (left <= 0) { clearInterval(timer); label.textContent = ""; go.disabled = false; }
        else label.textContent = t("Publicité · {s} s", { s: left });
      }, 1000);
    };
    askView(); document.body.append(veil);
  });
}

/* ============ Bibliothèque ============ */
const lib = { items: [] };
function countText() { const n = lib.items.length; return n === 0 ? t("Aucun fichier") : n === 1 ? t("1 fichier") : t("{n} fichiers", { n }); }
function addMedia(name, blob) {
  const item = { id: uid(), name, kind: kindFrom(name, blob.type), blob, url: URL.createObjectURL(blob) };
  lib.items.unshift(item);
  return item;
}
function removeMedia(id) {
  const f = lib.items.find((i) => i.id === id);
  if (f) URL.revokeObjectURL(f.url);
  lib.items = lib.items.filter((i) => i.id !== id);
}
function frame(item) {
  if (item.kind === "image") return h("img", { src: item.url, alt: item.name });
  if (item.kind === "video") return h("video", { src: item.url, controls: true });
  if (item.kind === "audio") return h("audio", { src: item.url, controls: true });
  if (item.kind === "pdf") return h("iframe", { src: item.url, title: item.name, style: "height:320px;border:0" });
  return h("p", { class: "note" }, fmt(item.blob.size));
}
function resultCard(item) {
  return h("div", { class: "card" },
    h("p", { class: "note ok", style: "margin-top:0" }, t("Ajouté à la bibliothèque · {name}", { name: item.name })),
    h("div", { style: "margin-top:10px" }, frame(item)),
    h("div", { class: "row" }, h("button", { class: "btn", onclick: () => saveAs(item.blob, item.name) }, t("Télécharger"))));
}

function field(label, control) { return h("label", { class: "f" }, h("span", null, label), control); }
function nameField(def) {

function drop(accept, multiple, label, onFiles) {
  const input = h("input", { type: "file", accept, multiple, style: "display:none", onchange: (e) => { const f = [...e.target.files]; if (f.length) onFiles(f); e.target.value = ""; } });

    ondragover: (e) => { e.preventDefault(); box.classList.add("over"); },
    ondragleave: () => box.classList.remove("over"),
    ondrop: (e) => { e.preventDefault(); box.classList.remove("over"); const f = [...e.dataTransfer.files]; if (f.length) onFiles(multiple ? f : f.slice(0, 1)); } },
    h("p", null, label), h("button", { class: "ghost", type: "button", onclick: () => input.click() }, t("Parcourir")), input);

}
function libPicker(kinds, onPick) {
  const wrap = h("div");
  const items = lib.items.filter((i) => kinds.includes(i.kind));
  if (!items.length) return wrap;
  wrap.append(h("p", { class: "note" }, t("Depuis la bibliothèque")),
    h("div", { class: "scroll" }, items.map((i) => h("button", { class: "pill", type: "button", style: "max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap", onclick: () => onPick(i) }, i.name))));
  return wrap;
}
function singlePick(accept, label, kinds) {
  const state = { pick: null };
  const chosen = h("div");
  const set = (p) => {
    state.pick = p; chosen.replaceChildren();
    if (p) chosen.append(h("div", { class: "chosen" }, h("span", null, p.name + " · " + fmt(p.blob.size)), h("button", { type: "button", onclick: () => set(null) }, t("Retirer"))));
  };
  const node = h("div", null,
    drop(accept, false, label, (f) => set({ name: f[0].name, blob: f[0] })),
    libPicker(kinds, (i) => set({ name: i.name, blob: i.blob })), chosen);
  return { node, state };
}
function multiPick(accept, label, kinds, limit) {
  const state = { items: [] };
  const list = h("div");
  const draw = () => {
    list.replaceChildren();
    if (!state.items.length) return;
    list.append(h("ul", { class: "list" }, state.items.map((it, i) => h("li", null,
      it.blob.type.startsWith("image/") ? h("img", { src: it.url, alt: "" }) : h("span", { style: "width:44px;height:44px;display:grid;place-items:center;font-size:11px;color:var(--mute)" }, t("fichier")),
      h("span", { class: "n" }, it.name),
      h("button", { class: "ic", "aria-label": t("Monter"), disabled: i === 0, onclick: () => move(i, -1) }, "↑"),
      h("button", { class: "ic", "aria-label": t("Descendre"), disabled: i === state.items.length - 1, onclick: () => move(i, 1) }, "↓"),
      h("button", { class: "ic", "aria-label": t("Retirer"), onclick: () => { const [r] = state.items.splice(i, 1); if (r.owned) URL.revokeObjectURL(r.url); draw(); } }, "✕")))));
  };
  const move = (i, d) => { const k = i + d; if (k < 0 || k >= state.items.length) return; const [x] = state.items.splice(i, 1); state.items.splice(k, 0, x); draw(); };
  const add = (name, blob, url, owned) => { if (state.items.length < limit) { state.items.push({ name, blob, url, owned }); draw(); } };
  const clear = () => { state.items.forEach((r) => r.owned && URL.revokeObjectURL(r.url)); state.items = []; draw(); };
  const node = h("div", null,
    drop(accept, true, label, (files) => files.forEach((f) => add(f.name, f, URL.createObjectURL(f), true))),
    libPicker(kinds, (i) => add(i.name, i.blob, i.url, false)), list);
  return { node, state, clear, add };
}
/* free = true : l'action ne consomme pas d'essai gratuit */
async function runTask(btn, out, task, free) {
  if (!free && !(await gate())) return;
  btn.disabled = true; out.replaceChildren();
  const st = h("p", { class: "note" }); out.append(st);
  try {
    const made = await task((x) => { st.textContent = x; });
    st.remove();
    if (made) { out.append(resultCard(addMedia(made.name, made.blob))); if (!free) spend(); }
  } catch (e) { st.className = "note err"; st.textContent = msg(e); }
  finally { btn.disabled = false; }
}
function textResult(text, name, out) {
  out.replaceChildren(h("textarea", { readonly: true, "aria-label": t("Résultat") }, text),
    h("div", { class: "row" },
      h("button", { class: "ghost", onclick: async (e) => { try { await navigator.clipboard.writeText(text); e.target.textContent = t("Copié"); } catch { e.target.textContent = t("Sélectionne le texte"); } } }, t("Copier")),
      h("button", { class: "ghost", onclick: (e) => { addMedia(name, new Blob([text], { type: "text/plain" })); e.target.textContent = t("Ajouté"); } }, t("Garder dans la bibliothèque"))));
}

/* ============ Moteur vidéo (ffmpeg.wasm) ============ */
const FF_BASE = "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd";
const FF_CORE = "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd";
let ffPromise = null, ffReport = null, ffQueue = Promise.resolve();
async function getFF(onStatus) {
  if (!ffPromise) ffPromise = (async () => {
    onStatus(t("Téléchargement du moteur vidéo (une seule fois)…"));
    await loadScript(FF_BASE + "/ffmpeg.js");
    await loadScript("https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js");
    const ff = new FFmpegWASM.FFmpeg();
    ff.on("progress", ({ progress }) => { if (ffReport && Number.isFinite(progress)) ffReport(Math.max(0, Math.min(1, progress))); });
    const { toBlobURL } = FFmpegUtil;
    await ff.load({
      coreURL: await toBlobURL(FF_CORE + "/ffmpeg-core.js", "text/javascript"),
      wasmURL: await toBlobURL(FF_CORE + "/ffmpeg-core.wasm", "application/wasm"),
      classWorkerURL: await toBlobURL(FF_BASE + "/814.ffmpeg.js", "text/javascript"),
    });
    return ff;
  })().catch((e) => { ffPromise = null; throw new Error(t("Le moteur vidéo n’a pas pu démarrer : {msg}", { msg: msg(e) })); });
  return ffPromise;
}
function ffRun(files, attempts, out, mime, label, onStatus, failMsg) {
  const task = async () => {
    const ff = await getFF(onStatus);
    onStatus(label + "…");
    ffReport = (v) => onStatus(label + "… " + Math.round(v * 100) + " %");
    try {
      for (const f of files) await ff.writeFile(f.name, await FFmpegUtil.fetchFile(f.blob));
      let code = 1;
      for (const args of attempts) { code = await ff.exec(args); if (code === 0) break; }
      if (code !== 0) throw new Error(failMsg);
      const data = await ff.readFile(out);
      return new Blob([data], { type: mime });
    } finally {
      ffReport = null;
      for (const f of files) await ff.deleteFile(f.name).catch(() => {});
      await ff.deleteFile(out).catch(() => {});
    }
  };
  const run = ffQueue.then(task, task);
  ffQueue = run.then(() => {}, () => {});
  return run;
}

function SocialPanel() {
  const link = h("input", { type: "url", placeholder: t("Colle le lien TikTok ou Facebook"), "aria-label": t("Lien de la vidéo") });

  const out = h("div");
  const hostOf = (raw) => { try { const x = raw.trim(); return new URL(/^https?:\/\//i.test(x) ? x : "https://" + x).hostname.toLowerCase(); } catch { return ""; } };
  const saveVideo = async (box, url, name) => {
    box.replaceChildren(h("p", { class: "note" }, t("Téléchargement…")));
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error("refused");
      const blob = await r.blob();
      if (!blob.size) throw new Error("empty");
      box.replaceChildren(resultCard(addMedia(name, new Blob([blob], { type: "video/mp4" }))));
    } catch {
      window.open(url, "_blank", "noopener");
      box.replaceChildren(h("p", { class: "note" }, t("Le navigateur ne permet pas l’enregistrement direct. La vidéo s’ouvre dans un nouvel onglet : appuie longuement dessus puis « Télécharger la vidéo ».")));
    }
  };
  const showFound = (url, title, cover) => {
    const box = h("div");
    const safe = (title || "video").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 30) || "video";
    out.replaceChildren(h("div", { class: "card" },
      h("p", { class: "note ok", style: "margin-top:0" }, t("Vidéo trouvée") + (title ? " · " + title : "")),

      h("div", { class: "row" }, h("button", { class: "btn", onclick: () => saveVideo(box, url, "tiktok-" + safe + ".mp4") }, t("Télécharger")))), box);
  };
  const btn = h("button", { class: "btn", style: "margin-top:16px", onclick: async () => {
    out.replaceChildren(); const st = h("p", { class: "note" }, t("Recherche de la vidéo…")); out.append(st);
    const fail = (x) => { st.className = "note err"; st.textContent = x; };
    btn.disabled = true;
    try {
      const raw = link.value.trim(); if (!raw) return fail(t("Colle d’abord le lien de la vidéo."));
      const host = hostOf(raw); if (!host) return fail(t("Ce lien n’est pas valide."));
      const isFb = /(facebook\.com|fb\.watch|fb\.com)$/.test(host), isTt = /(tiktok\.com|tt\.site)$/.test(host);
      if (!isFb && !isTt) return fail(t("Seuls les liens TikTok et Facebook sont pris en charge."));
      if (!(await gate())) { out.replaceChildren(); return; }
      st.textContent = t("Recherche de la vidéo…"); out.replaceChildren(st);
      const base = srv.value.trim().replace(/\/+$/, "");
      if (base) {
        store.set("etabli-server", base);
        let res; try { res = await fetch(base + "/api/social?url=" + encodeURIComponent(raw)); } catch { return fail(t("Ton serveur ne répond pas. Vérifie l’adresse, ou vide la case pour utiliser la méthode sans serveur.")); }
        if (!res.ok) { let m = t("Le téléchargement a échoué."); try { const d = await res.json(); if (d.error) m = d.error; } catch {} return fail(m); }
        const blob = await res.blob(); if (!blob.size) return fail(t("Le fichier reçu est vide."));
        out.replaceChildren(resultCard(addMedia(res.headers.get("x-filename") || "video.mp4", new Blob([blob], { type: "video/mp4" })))); spend(); return;
      }
      if (isFb) return fail(t("Facebook ne peut pas être téléchargé sans serveur : il bloque les accès depuis une simple page. Renseigne ton serveur dans « Options avancées »."));
      let data;
      try { const r = await fetch("https://www.tikwm.com/api/?url=" + encodeURIComponent(raw) + "&hd=1"); data = await r.json(); }
      catch { return fail(t("Impossible de joindre le service de recherche depuis cette page (blocage du navigateur ou pas d’internet). Essaie avec ton propre serveur.")); }
      const d = data && data.code === 0 && data.data;
      if (!d) return fail((data && data.msg) ? t("Le service répond : {msg}", { msg: data.msg }) : t("Vidéo introuvable. Elle est peut-être privée ou supprimée."));
      const mediaUrl = (u) => (u ? (u.startsWith("http") ? u : "https://www.tikwm.com" + u) : "");

    st(t("Récupération…"));

    try { res = await fetch(u); } catch { throw new Error(t("Ton navigateur bloque la récupération : ce site refuse que d’autres pages lisent ses fichiers (protection « CORS »). Télécharge le fichier à la main puis dépose-le ici.")); }

          try { for (const s of scans) { st(t("Scan de la page {i}", { i: s.i })); const r = await w.recognize(s.c); const tx = r.data.text.trim(); if (tx) slots[s.i - 1] = count > 1 ? `${t("— Page {i} —", { i: s.i })}\n${tx}` : tx; } } finally { await w.terminate(); }
        }
        if (pdf.numPages > 8) slots.push(t("Seules les 8 premières pages ont été lues."));
        text = slots.filter(Boolean).join("\n\n").trim();
      } else {
        const w = await makeOcr(lang, st);
        try {
          const parts = [];
          for (let i = 0; i < imgs.length; i++) { if (imgs.length > 1) st(t("Image {i} / {n}", { i: i + 1, n: imgs.length })); const r = await w.recognize(imgs[i].blob); const tx = r.data.text.trim(); if (tx) parts.push(imgs.length > 1 ? `${t("— Image {i} —", { i: i + 1 })}\n${tx}` : tx); }
          text = parts.join("\n\n").trim();
        } finally { await w.terminate(); }
      }
      if (!text) throw new Error(t("Aucun texte repéré. Essaie une image plus nette, ou une autre langue."));
      textResult(text, "scan.txt", out); st(t("Lecture terminée.")); spend();
    } catch (e) { status.className = "note err"; status.textContent = msg(e); }
    finally { btn.disabled = false; }
  } }, t("Lire le texte"));
  return sheet(t("Scanner"), t("Lis le texte d’images ou d’un PDF (8 pages maximum)."), m.node, field(t("Langue"), select(OCR, lang, (v) => { lang = v; })), btn, status, out);
}

function PremiumPanel() {
  let choice = "year";
  const s = readPlan();
  const body = h("div");
  const draw = () => {
    const now = readPlan();
    body.replaceChildren(...[
      h("p", { class: "note ok", style: "margin-top:0" }, now.premium ? t("Premium actif.") : t("Version gratuite : {n} utilisations aujourd’hui.", { n: FREE_DAILY + now.bonus })),
      h("ul", { class: "feat" }, h("li", null, t("Aucune publicité")), h("li", null, t("Utilisations illimitées"))),
      now.premium ? h("button", { class: "ghost", style: "margin-top:16px", onclick: () => { const p = readPlan(); p.premium = false; writePlan(p); refreshPlan(); draw(); } }, t("Revenir à la version gratuite"))
        : [h("div", { class: "plans" },
            [["month", t("Mensuel"), t("{p} / mois", { p: "4,99 €" })], ["year", t("Annuel"), t("{p} / an", { p: "39,99 €" })]].map(([id, label, price]) =>
              h("button", { class: "plan" + (choice === id ? " on" : ""), type: "button", onclick: () => { choice = id; draw(); } }, h("b", null, label), h("small", null, price)))),
           h("button", { class: "btn", style: "margin-top:16px", onclick: () => { const p = readPlan(); p.premium = true; writePlan(p); refreshPlan(); draw(); } }, t("Activer Premium (démo)"))],
      h("p", { class: "warn" }, t("Mode démo : aucun paiement réel n’est branché. Ce bouton active simplement Premium sur cet appareil pour tester l’affichage."))].flat());
  };
  draw();
  return sheet(t("Premium"), t("Retire les pubs et les limites."), body);
}

/* ============ Navigation ============ */
const TOOLS = [
  ["library", "Bibliothèque", "Tes fichiers", LibraryPanel],
  ["browser", "Navigateur", "Consulter une page", BrowserPanel],
  ["social", "TikTok / Facebook", "Vidéo publique", SocialPanel],
  ["import", "Lien direct", "Fichier public", ImportPanel],
  ["compress", "Compresser", "Vidéo, 4 qualités", CompressPanel],
  ["pdf", "Images en PDF", "Une page par image", PdfPanel],
  ["speak", "Lecture", "Plusieurs langues", SpeakPanel],
  ["transcribe", "Transcrire", "Micro ou fichier", TranscribePanel],
  ["extract", "Extraire le son", "Depuis une vidéo", ExtractPanel],
  ["collage", "Collage", "Ligne ou colonne", CollagePanel],
  ["mux", "Son + vidéo", "Réunir les deux", MuxPanel],
  ["join", "Bout à bout", "Sons ou vidéos", JoinPanel],
  ["ocr", "Scanner", "Image ou PDF", OcrPanel],
  ["premium", "Premium", "Sans pubs ni limites", PremiumPanel],
];
let currentTool = "library";
function renderHeader() {
  document.documentElement.lang = LANG;
  const sel = h("select", { class: "langsel", "aria-label": t("Langue"), onchange: (e) => { LANG = e.target.value; store.set("etabli-lang", LANG); renderHeader(); show(currentTool); } },
    Object.entries(LANGS).map(([k, v]) => h("option", { value: k }, v)));
  sel.value = LANG;
  document.getElementById("head").replaceChildren(
    h("div", null, h("div", { class: "brand" }, "Établi"), h("div", { class: "sub" }, t("Atelier média"))),
    h("div", { class: "ctrl" }, sel, h("button", { class: "planpill", id: "planpill", onclick: () => show("premium") })));
  refreshPlan();
}
function show(id) {
  currentTool = id;
  const tool = TOOLS.find((x) => x[0] === id) || TOOLS[0];
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  document.getElementById("main").replaceChildren(tool[3]());
  document.getElementById("nav").replaceChildren(...TOOLS.map(([tid, label, hint]) =>
    h("button", { type: "button", "aria-current": tid === id ? "page" : null, onclick: () => show(tid) }, h("span", null, t(label)), h("small", null, tid === "library" ? countText() : t(hint)))));
  window.scrollTo(0, 0);
}
renderHeader();
show("library");
</script>
